services:
  mysql:
    image: mysql:8.0
    container_name: nairawave-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: nairawave
      MYSQL_USER: nairawave
      MYSQL_PASSWORD: nairawave_dev_password
      MYSQL_ROOT_PASSWORD: root_secure_password
    ports:
      - "3306:3306"
    volumes:
      - nairawave_mysqldata:/var/lib/mysql

volumes:
  nairawave_mysqldata: